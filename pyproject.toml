[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "min_pair_sat_scalability"
version = "0.1.0"
description = "Tool and testground for studying the scalability of SAT-based min-pair problems."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rodion Melnikov" }]
dependencies = ["python-sat>=1.8.dev0"]

[project.optional-dependencies]
dev = ["pytest"]
gen = ["networkx"]  # random graph generators (next stage)
smt = ["z3-solver"]
plot = ["matplotlib"]  # analysis/plot_results.py  # optional SMT backend (not wired in yet)

[project.scripts]
min-pair-sat = "min_pair_sat_scalability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
min_pair_sat_scalability = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
